name: Smol
description: >-
  Smol is a UK-based direct-to-consumer home-care brand founded in 2018 by Paula
  Quazi and Nick Green, delivering concentrated, plant-based, cruelty-free
  cleaning products — laundry capsules, dishwasher tablets, fabric conditioner,
  surface sprays and personal-care bars — on a flexible subscription that ships
  refills through the letterbox. The company positions itself as a sustainability
  challenger to legacy home-care brands, emphasizing reduced plastic, carbon and
  chemical load, and became a certified B Corporation in July 2022. Backed by
  Balderton Capital and GV, Smol operates a consumer e-commerce and subscription
  business; it publishes no public developer API, SDKs or developer program.
